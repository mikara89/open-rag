name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test-format:
    name: Build, test, and format
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OpenRAG.slnx

      - name: Build
        run: dotnet build OpenRAG.slnx --no-restore

      - name: Test
        run: dotnet test OpenRAG.slnx --no-build

      - name: Verify whitespace formatting
        run: dotnet format whitespace OpenRAG.slnx --verify-no-changes --no-restore

      - name: Verify style formatting
        run: dotnet format style OpenRAG.slnx --verify-no-changes --no-restore

  docs-check:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate documentation
        shell: pwsh
        run: ./scripts/docs-check.ps1
